// Base: sin Realm ni :pc-legacy. Instala :pc a demanda y abre SpikeActivity por nombre.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.tgn.spike'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.tgn.spike'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    dynamicFeatures = [':pc']
}

dependencies {
    api 'com.google.android.play:feature-delivery:2.1.0'
    // Igual que TGN: gson y maps estan en la base. :pc-legacy los usa (Pipeline) y quedan deduplicados
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.android.gms:play-services-maps:19.1.0'
}
